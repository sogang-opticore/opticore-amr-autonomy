# E5 - observation representation: MLP vs 1D-CNN encoder, 4-frame stack vs
# newest-scan-only (temporal information ablation).
name: e5_representation
trainer: ppo_v2
base_config: ppo_v2
training_seeds: [7, 17, 29]
budget:
  total_timesteps: 1000000
variants:
  default: {}
grid:
  network.encoder: [mlp, cnn]
  environment_overrides.history_mode: [stack, newest]
parallel_trials: 2
selection:
  protocol: evaluation_selection_v2
  workers: 4
  rule:
    constraints: {collision_rate_max: 0.15, timeout_rate_max: 0.15}
test:
  protocol: evaluation_test_v2
  workers: 4
