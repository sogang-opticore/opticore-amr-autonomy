# E4 - sensor/actuation/localization randomization on vs off (Lite -> Gazebo gap).
name: e4_randomization
trainer: ppo_v2
base_config: ppo_v2
training_seeds: [7, 17, 29]
budget:
  total_timesteps: 1000000
variants:
  randomized_curriculum: {}
  no_randomization: {environment_overrides: {domain_randomization: {enabled: false}}}
parallel_trials: 2
selection:
  protocol: evaluation_selection_v2
  workers: 4
  rule:
    constraints: {collision_rate_max: 0.15, timeout_rate_max: 0.15}
test:
  protocol: evaluation_test_v2
  workers: 4
