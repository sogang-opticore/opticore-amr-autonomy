# Procedural scenario families (amr_lite.envs.procedural).
#
# Scenario ids: P-<FAMILY> (static) and PD-<FAMILY> (with dynamic agents),
# FAMILY in AISLE, HALL, PINCH, JUNCTION, MIXED (MIXED picks a family per seed).
# The split is chosen by the environment config `procedural.split`.
#
# Splits separate generation-rule parameter regions, not individual maps:
#   train       - nominal ranges used for learning
#   validation  - mostly interpolation plus mild extrapolation (checkpoint selection)
#   test        - disjoint extremes (narrower aisles, denser clutter, faster agents)
#                 and the `patrol` motion pattern that is never trained
# Changing a range changes the protocol: bump the evaluation protocol version.
map_width: 16.0
map_height: 12.0
min_path_length: 5.0
max_path_length: 22.0
max_attempts: 40
nominal_robot_speed: [0.8, 1.2]
families: [AISLE, HALL, PINCH, JUNCTION]
splits:
  train:
    aisle: {aisle_width: [1.8, 2.6], shelf_depth: [0.8, 1.2], gap_width: [1.8, 2.6], gaps_per_row: [1, 2]}
    hall: {pallets: [5, 10], pallet_size: [0.5, 1.2]}
    pinch: {corridor_width: [2.4, 3.2], pinch_width: [1.3, 1.8], pinches: [1, 2], jog: [0.0, 0.8]}
    junction: {corridor_width: [2.0, 2.8], shapes: [X, T, L], clutter: [0, 2]}
    dynamic:
      count: [1, 2]
      speed: [0.2, 0.7]
      radius: [0.22, 0.32]
      patterns: [cross, head_on, follow, stop, static]
  validation:
    aisle: {aisle_width: [1.7, 2.8], shelf_depth: [0.8, 1.3], gap_width: [1.7, 2.8], gaps_per_row: [1, 2]}
    hall: {pallets: [4, 12], pallet_size: [0.5, 1.3]}
    pinch: {corridor_width: [2.3, 3.4], pinch_width: [1.25, 1.9], pinches: [1, 3], jog: [0.0, 1.0]}
    junction: {corridor_width: [1.9, 3.0], shapes: [X, T, L], clutter: [0, 3]}
    dynamic:
      count: [1, 2]
      speed: [0.2, 0.8]
      radius: [0.22, 0.34]
      patterns: [cross, head_on, follow, stop, static]
  test:
    aisle: {aisle_width: [1.5, 1.8], shelf_depth: [1.0, 1.4], gap_width: [1.5, 1.8], gaps_per_row: [1, 1]}
    hall: {pallets: [10, 14], pallet_size: [0.6, 1.4]}
    pinch: {corridor_width: [2.0, 2.4], pinch_width: [1.1, 1.3], pinches: [2, 3], jog: [0.6, 1.2]}
    junction: {corridor_width: [1.7, 2.0], shapes: [X, T, L], clutter: [1, 3]}
    dynamic:
      count: [1, 3]
      speed: [0.3, 0.9]
      radius: [0.22, 0.36]
      patterns: [cross, head_on, patrol, stop]
