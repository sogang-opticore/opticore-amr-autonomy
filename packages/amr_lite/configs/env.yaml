seed: 7
robot_radius: 0.36
obstacle_inflation: 0.04
safety_distance: 0.30
v_max: 1.5
w_max: 1.8
accel_max: 1.0
decel_max: 1.5
angular_accel_max: 3.0
policy_dt: 0.05
physics_dt: 0.01
physics_substeps: 5
lidar_rays: 72
lidar_fov_deg: 270.0
lidar_max_range: 8.0
history_frames: 4
# stack: last four scans (contract). newest: the latest scan in all four slots
# (frame-stack ablation; the ROS adapter reads it from the bundle contract).
history_mode: stack
lookahead_distance: 0.65
goal_distance_scale: 8.0
max_cross_track_error: 2.0
goal_tolerance: 0.25
episode_timeout: 18.0
# 0 keeps the fixed timeout (Phase 0/M1). For long procedural/warehouse paths:
# timeout = max(episode_timeout, episode_timeout_base + per_meter * A* length).
episode_timeout_per_meter: 0.0
episode_timeout_base: 6.0
reward_progress: 10.0
reward_goal: 20.0
reward_collision: -10.0
reward_near: -2.0
reward_smooth: -0.3
reward_path: -0.2
reward_idle: -0.1
reward_heading: -0.05
reward_turn: -0.02
reward_time: -0.01
grid_resolution: 0.20
# opticore-amr A* wall-distance cost (astar_node.clearance_preference_cost),
# values from its astar_params.yaml. Off for Phase 0/M1 scenarios.
astar_clearance:
  enabled: false
  preferred_clearance: 0.50
  clearance_cost_weight: 9.0
  wall_avoid_clearance: 0.55
  wall_avoid_cost_weight: 3.0
  wall_avoid_min_margin: 0.05
  simplify_min_clearance: 0.45
scenario: S0
shield_enabled: true
shield_horizon: 0.7
shield_strategy: legacy
shield_static_horizon: 0.45
shield_dynamic_horizon: 2.5
shield_static_margin: 0.01
shield_dynamic_margin: 0.08
shield_audit_static_horizon: 0.45
shield_audit_dynamic_horizon: 2.5
shield_sim_dt: 0.05
shield_tracker_alpha: 0.65
shield_slow_scales: [0.5, 0.2]
shield_evade_v: 0.55
shield_evade_w: 1.45
shield_reverse_enabled: true
shield_reverse_max: 0.35
shield_reverse_w: 0.8
record_shield_trace: false
# shield_strategy: scan -> LiDAR-only shield shared with the ROS learned planner
# (amr_lite.planning.scan_shield); rollouts obey the acceleration limits above.
scan_shield:
  horizon: 0.7
  sim_dt: 0.05
  static_margin: 0.03
  dynamic_horizon: 1.5
  dynamic_margin: 0.08
  slow_scales: [0.5, 0.2]
  evade_v_fraction: 0.45
  evade_w_fraction: 0.65
  reverse_enabled: false
  reverse_max: 0.35
  reverse_w: 0.8
  max_point_range: 4.0
  use_tracks: true
  track_min_speed: 0.15
scan_tracker:
  cluster_gap: 0.35
  min_points: 3
  max_radius: 0.85
  association_distance: 0.9
  timeout: 1.0
  velocity_alpha: 0.5
  max_speed: 2.0
  static_filter_distance: 0.0   # > 0 drops clusters this close to the static map
scenario_randomization:
  enabled: false
  start_xy: 0.12
  start_theta: 0.10
  goal_xy: 0.12
  dynamic_position: 0.25
  dynamic_speed_fraction: 0.15
  dynamic_start_delay: 0.40
  dynamic_radius: 0.03
# Procedural families (configs/procedural.yaml): scenario ids P-* and PD-*.
procedural:
  spec: procedural
  split: train
# opticore-amr warehouse map scenarios: WH-RANDOM, WHD-RANDOM, WH-<set>-<NN>.
warehouse:
  map: opticore_warehouse
  min_clearance: 0.7
  path_length: [6.0, 25.0]
  max_attempts: 40
# Robot profile applied through amr_lite.config.resolve_env_config.
robot_profile: lite_default
# contract: 72 rays cast from the robot centre (Phase 0/M1 contract).
# raw: simulate the raw sensor below, then resample to the contract
#      (amr_lite.sensors.lidar.resample_scan, shared with the ROS adapter).
lidar_model:
  type: contract
  raw_samples: 720
  raw_angle_min: -3.14159
  raw_angle_max: 3.14159
  raw_range_min: 0.12
  raw_range_max: 25.0
  mount_x: 0.25
  mount_y: 0.0
  mount_yaw: 0.0
# Base sensor/actuation/localization model. All values below are no-ops.
sensor_model:
  scan_period: 0.05
  range_noise_std: 0.0
  dropout_probability: 0.0
  angular_bias_deg: 0.0
  observation_delay_steps: 0
  action_delay_steps: 0
  v_scale: 1.0
  w_scale: 1.0
  actuator_time_constant: 0.0
  collision_radius_margin: 0.0
  localization_bias_xy: 0.0
  localization_bias_theta: 0.0
  localization_noise_xy: 0.0
  localization_noise_theta: 0.0
  path_resample_spacing: 0.0
  path_lateral_noise: 0.0
# Per-episode randomization of the values above (Lite <-> Gazebo gap).
# With probability `probability` an episode samples every range below.
domain_randomization:
  enabled: false
  probability: 1.0
  randomize_scan_phase: true
  ranges:
    range_noise_std: [0.0, 0.05]
    dropout_probability: [0.0, 0.03]
    angular_bias_deg: [-1.0, 1.0]
    observation_delay_steps: [0, 1]
    action_delay_steps: [0, 1]
    v_scale: [0.92, 1.05]
    w_scale: [0.88, 1.05]
    actuator_time_constant: [0.0, 0.10]
    collision_radius_margin: [0.0, 0.03]
    localization_bias_xy: [0.0, 0.06]
    localization_bias_theta: [0.0, 0.03]
    localization_noise_xy: [0.0, 0.01]
    localization_noise_theta: [0.0, 0.005]
    path_resample_spacing: [0.05, 0.20]
    path_lateral_noise: [0.0, 0.02]
