[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticore-amr-lite"
version = "0.1.0"
description = "ROS-free 2D autonomy and local-planning spike for OptiCore AMR"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6", "torch>=2", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["amr_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
